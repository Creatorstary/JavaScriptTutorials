<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="h-[400px] flex justify-center items-center">
    <div class="w-[25%] h-auto flex flex-col gap-2 p-2">
        <input id="start" class="outline-1 outline-black h-[30px] bg-white px-[5px]" type="text"
            placeholder="From what range">
        <input id="end" class="outline-1 outline-black h-[30px] bg-white px-[5px] mb-2" type="text"
            placeholder="To what range">
        <button onclick="range()"
            class="bg-green-300 py-1 px-2 hover:bg-green-500 active:bg-green-700 active:text-white">Check Range</button>

        <p id="output" class="mt-2 bg-white p-1">.</p>
    </div>
</body>

<script>
    const start = document.getElementById('start');
    const end = document.getElementById('end');
    let output = document.getElementById('output');

    function range() {
        let startvalue = start.value;
        startvalue = +startvalue
        let endvalue = end.value;
        endvalue = +endvalue
        let randomNum = Math.random();
        let numRange = Math.floor(Math.random() * (endvalue - startvalue)) + startvalue;
        output.innerHTML = numRange

    }
</script>

</html>
