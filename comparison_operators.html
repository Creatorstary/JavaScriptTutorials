<script>

    //Comparison operators
    
    let numberA = 10;
    let numberB = 20;
    let numberC = 15;
    
    console.log(numberA > numberB) //false
    console.log(numberB > numberA) //true

    console.log(numberA < numberB) //true
    console.log(numberB < numberA) //false

    console.log(numberA <= numberB) //true
    console.log(numberA <= numberA) //true
    console.log(numberA >= numberC) //false
    
    // ==
    // ===

    console.log(2 == 2) //true
    console.log(2 == '2') //true

    console.log(1 === true) //false
    console.log(true === true) //true
    console.log(2 === '2') //false
