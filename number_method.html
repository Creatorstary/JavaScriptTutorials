<script>
    // parenthesis: ()
    // square braskets: []
    // braces: {}
    // parseint(), parseFloat(), toString(), toFixed(), toPecision(), isinteger(), isinfinity

    let num = '12345'
    console.log(num + 1);

    num = parseInt(num)
    console.log(num + 1)


    let operation = 1 + '234' + (1 + 2)
    console.log(operation)


    let num2 = 1234.73; // number
    let num3 = '1234.23'; // numerical string


    console.log(parseInt(num2));
    console.log(parseFloat(num2));
    console.log(parseFloat(num3));


    let userinput = 'abc124';
    console.log(parseInt(userinput));

    console.log(NaN + 1 * 2)

    console.log(parseInt(userinput2)); //123      

    let number = 1235;

    number = number.toString();

    console.log(decimalNumber.toFixed(1)); //10.5

    console.log(isNaN('234'));

    Number.isInteger(12.34) //false
    
function convertNum(){

}
